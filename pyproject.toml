[project]
name = "gca"
version = "0.1.0"
description = "Git commit analyzer for CI pipelines"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm-llama-cpp = ["llama-cpp-python>=0.3", "huggingface-hub>=0.23"]
llm-transformers = ["transformers>=4.0", "torch>=2.0"]
llm = ["gca[llm-llama-cpp]"]

[project.scripts]
gca = "git_commit_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_commit_analyzer"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.11",
]
llm-llama-cpp = [{ include-group = "dev" }, "llama-cpp-python>=0.3", "huggingface-hub>=0.23"]
llm-transformers = [{ include-group = "dev" }, "transformers>=4.0", "torch>=2.0"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "llm-transformers" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a real LLM model and config (deselect with -m 'not integration')",
]
