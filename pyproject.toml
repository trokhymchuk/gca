[project]
name = "git-commit-analyzer"
version = "0.1.0"
description = "Git commit analyzer for CI pipelines"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3"]

[project.scripts]
git-commit-analyzer = "git_commit_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_commit_analyzer"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
