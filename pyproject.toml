[project]
name = "gca"
version = "0.1.0"
description = "Git commit analyzer for CI pipelines"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3", "huggingface-hub>=0.23"]

[project.scripts]
gca = "git_commit_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_commit_analyzer"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require llama-cpp-python and llm-config.yml (deselect with -m 'not integration')",
]
