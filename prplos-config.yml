# ---- Application configuration ----------------------------------------------
# Optional section. All keys have sensible defaults.
config:
  # Exit code returned when one or more commits fail a rule. Default: 1.
  exit_code_on_failure: 1

  # Print diagnostic info (commits being checked, LLM prompts/responses) to
  # stderr. Useful during ruleset development. Default: false.
  debug: false

rules:
  # every non-fixup commit must have a description at least 80 chars
  - name: description-is-present
    filters:
      - type: is_fixup
        invert: true
    checkers:
      - type: description_min_length
        min_length: 80

  # every non-fixup commit must have a description line width up to 120 symbols
  - name: description-max-width-is-correct
    filters:
      - type: is_fixup
        invert: true
    checkers:
      - type: description_line_max_length
        max_length: 120

  # every non-fixup commit must have a ticket referenced
  - name: require-ticket-reference
    filters:
      - type: is_fixup
        invert: true
    checkers:
      - type: any_trailer_present
        tokens: ["Fixes", "Closes", "References"]

  # every commit must have a signed-off-by trailer
  - name: require-sign-off
    checkers:
      - type: trailer_present
        token: "Signed-off-by"

  # if any profile is updated:
  # 1. prohibit modification of other files
  # 2. requires 'profiles: ' prefix in the commit subject
  - name: profiles-updated
    filters:
      - type: directory_modified
        directories: ["profiles/"]
    checkers:
      - type: directory_modified
        directories: ["profiles/"]
      - type: subject_matches_regex
        pattern: "^profiles:.+$"

  # if gitlab-ci.yml is modified:
  # 1. prohibit modification of files in other directories
  # 2. requires 'ci: ' prefix in the commit subject
  - name: gitlab-ci-modified
    filters:
      - type: file_modified
        files: [".gitlab-ci.yml"]
    checkers:
      - type: file_modified
        files: [".gitlab-ci.yml"]
      - type: subject_matches_regex
        pattern: "^ci:.+$"

  # if any file in the .gitlab/ is updated:
  # 1. prohibit modification of files in other directories
  # 2. requires 'ci: cram: ' prefix in the commit subject
  - name: cram-tests-updated
    filters:
      - type: directory_modified
        directories: [".gitlab/"]
    checkers:
      - type: directory_modified
        directories: [".gitlab/"]
      - type: subject_matches_regex
        pattern: "^ci:.+$"

  # if any cram test is updated:
  # 1. prohibit modification of files in other directories (cram tests modified in a separate commit)
  # 2. requires 'ci: cram: ' prefix in the commit subject
  - name: cram-tests-updated
    filters:
      - type: directory_modified
        directories: [".gitlab/tests/cram/"]
    checkers:
      - type: directory_modified
        directories: [".gitlab/tests/cram/"]
      - type: subject_matches_regex
        pattern: "^ci: cram:.+$"

