name: Docker Static — Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (static)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Docker/static/Dockerfile
          target: final
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
