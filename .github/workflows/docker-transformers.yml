name: Docker (transformers)

on:
  workflow_dispatch:

jobs:
  docker-transformers:
    name: Docker (transformers)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Docker/transformers/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gca-llm-transformers:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
