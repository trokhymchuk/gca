name: Docker llama-cpp heavy — Test

on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Test (llama-cpp heavy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Docker/llama-cpp/Dockerfile
          target: heavy-test
          load: true
          tags: gca-llm-llama-cpp-heavy-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
      # --network none proves the baked model loads with no Hugging Face access.
      - run: docker run --rm --network none gca-llm-llama-cpp-heavy-test:latest
