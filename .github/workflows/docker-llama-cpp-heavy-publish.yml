name: Docker llama-cpp heavy — Publish

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish (llama-cpp heavy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Docker/llama-cpp/Dockerfile
          target: heavy
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gca-llm-llama-cpp-heavy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
