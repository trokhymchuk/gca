name: Docker (llama-cpp)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (llama-cpp)
    environment: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Docker/llama-cpp/Dockerfile
          target: final
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Test (llama-cpp)
    needs: build
    environment: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Docker/llama-cpp/Dockerfile
          target: test
          load: true
          tags: gca-llm-llama-cpp-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm -e HF_TOKEN=${{ secrets.HF_TOKEN }} gca-llm-llama-cpp-test:latest

  publish:
    name: Publish (llama-cpp)
    needs: test
    environment: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Docker/llama-cpp/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gca-llm-llama-cpp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
