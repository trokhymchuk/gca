name: Docker (llm)


on:
  workflow_dispatch:

jobs:
  docker-llm:
    name: Docker (llm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Docker/llm/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gca-llm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
