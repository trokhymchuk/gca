name: Docker Static — Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/docker-static-build.yml
    secrets: inherit

  test:
    needs: build
    uses: ./.github/workflows/docker-static-test.yml
    secrets: inherit

  publish:
    name: Publish (static)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Docker/static/Dockerfile
          target: final
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gca-static:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
