name: Docker Transformers — Build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build (transformers)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Docker/transformers/Dockerfile
          target: final
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
